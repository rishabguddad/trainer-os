<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrainerOS</title>
<meta name="description" content="Clients, session packages and payments for personal trainers.">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1018" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TrainerOS">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
 // Apply a saved light/dark override before first paint to avoid a flash.
 try{var t=(JSON.parse(localStorage.getItem('traineros.v5')||'{}').settings||{}).theme;if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<main id="view" class="view" tabindex="-1"></main>
<nav id="tabbar" class="tabbar" aria-label="Main"></nav>
<div id="sheet" class="sheet-root" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<datalist id="workouts"></datalist>
<noscript><p style="padding:24px">TrainerOS needs JavaScript enabled.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
